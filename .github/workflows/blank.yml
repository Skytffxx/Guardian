name: Guardian AC
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn clean package
      - uses: softprops/action-gh-release@v2
        with:
          files: guardian-core/target/Guardian-*.jar
